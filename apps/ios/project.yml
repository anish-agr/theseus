# XcodeGen spec — the CI macOS runner turns this into Theseus.xcodeproj
# (no generated project files in the repo). See .github/workflows/ios.yml.
name: Theseus
options:
  bundleIdPrefix: dev.anish
  deploymentTarget:
    iOS: "17.0"
packages:
  NavCore:
    path: ../navcore
targets:
  Theseus:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: NavCore
        product: NavCore
    # A real Info.plist rather than GENERATE_INFOPLIST_FILE. Xcode
    # reserves CFBundleIconName for itself, and actool only injects it
    # for a full classic icon set — so with a generated plist the key
    # silently goes missing and App Store Connect rejects the upload
    # (ITMS-90713). Writing the plist ourselves makes it deterministic.
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        NSCameraUsageDescription: "Theseus scans the room with the camera to build a live navigation map."
        # no encryption beyond what iOS itself provides — declaring it
        # skips the export-compliance prompt on every TestFlight build
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.anish.theseus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
