# XcodeGen spec — the CI macOS runner turns this into Theseus.xcodeproj
# (no generated project files in the repo). See .github/workflows/ios.yml.
name: Theseus
options:
  bundleIdPrefix: dev.anish
  deploymentTarget:
    iOS: "17.0"
packages:
  NavCore:
    path: ../navcore
targets:
  Theseus:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: NavCore
        product: NavCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.anish.theseus
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # actool emits CFBundleIcons but not CFBundleIconName for a
        # single-size universal icon; App Store Connect rejects uploads
        # without it (ITMS-90713), so set it explicitly.
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: "Theseus scans the room with the camera to build a live navigation map."
        # no encryption beyond what iOS itself provides — declaring it
        # here skips the export-compliance prompt on every TestFlight build
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
